<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my profile</title>
    <style>
        *{
    box-sizing: border-box;
}
body{
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
}
h1{
    text-align: center;
    color: #333;
}
.container{
    background-color: white;
    padding: 25px;
    border:3px dashed #888;
    margin: 20px;
    text-align: center;
}
.box{
    width: 800px;
    height: 500px;
    background-color: #3498db;
    margin: 10px;
    display: inline-block;
    font-weight: bold;
    text-align: center;
    padding: 35px;
    color: white;
}
   .profile-card{
            width: 300px;
            background-color: #eff6ff;
            padding: 20px;
            border: 2px solid;
            border-radius: 18px;
            text-align: center;
            color: blue;
            margin: 40px auto;
        }
                .top-bar{
            position: sticky;
            top: 0;
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 20px;
            z-index: 1000;
        }
                .bio {
            padding: 10px;
            box-sizing: border-box;
            height: 130px;
            overflow: auto;
        }
        .add button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        .add button:hover {
            background-color: #1e40af;
        }

    </style>
</head>
<body>
       <div class="top-bar">
        <h1>MY PROFILE</h1>
    </div>
    <div>
        <div class="profile-card">
            <h2>Vikas</h2>
            <p>Web Developer</p>
            <div class="bio">
                Hiiiiii I am Vikas, I started coding this year. I like making small websites.
            </div>
        </div>
    </div>
    <div class="add">
        <button>+</button>
    </div>
</body>
</html>
